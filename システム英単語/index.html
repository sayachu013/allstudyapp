<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>システム英単語 テスト</title>
  <style>
    :root {
      --primary-color: #1f4e78;
      --accent-color: #2563eb;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --ok-color: #16a34a;
      --ng-color: #dc2626;
      --review-color: #d97706;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; max-width: 500px; margin: 0 auto; }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 { color: var(--primary-color); font-size: 1.4rem; }

    .btn-home {
      background-color: #64748b;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .panel {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    .form-group { margin-bottom: 15px; }
    label { font-weight: bold; font-size: 0.9rem; display: block; margin-bottom: 5px; }
    input[type="number"], select {
      width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem;
    }

    .range-inputs { display: flex; gap: 10px; align-items: center; }

    .btn {
      background-color: var(--accent-color); color: white; border: none; padding: 12px;
      border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; width: 100%; transition: opacity 0.2s;
      margin-top: 5px;
    }
    .btn:hover { opacity: 0.9; }

    .btn-review {
      background-color: var(--review-color);
      margin-top: 10px;
    }

    /* テストカード */
    .card {
      background: var(--card-bg); border-radius: 12px; border: 2px solid #e2e8f0;
      padding: 30px 20px; text-align: center; position: relative; margin-bottom: 20px; min-height: 220px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    .card-num { position: absolute; top: 12px; left: 15px; font-size: 0.85rem; color: #64748b; font-weight: bold; }
    .card-label { position: absolute; top: 12px; right: 15px; font-size: 0.75rem; background: #e2e8f0; padding: 2px 8px; border-radius: 4px; color: #475569; }
    
    .question-text { font-size: 2rem; font-weight: bold; color: var(--primary-color); margin-bottom: 10px; word-break: break-word; }
    .answer-text { font-size: 1.3rem; font-weight: bold; color: #0f172a; margin-top: 15px; padding-top: 15px; border-top: 1px dashed #cbd5e1; width: 100%; word-break: break-word; }

    /* 解答ボタン */
    .answer-btns { display: flex; gap: 10px; margin-top: 15px; }
    .btn-ok { background-color: var(--ok-color); }
    .btn-ng { background-color: var(--ng-color); }

    /* 結果画面 */
    .result-score { font-size: 2rem; font-weight: bold; text-align: center; color: var(--primary-color); margin: 15px 0; }
    
    .hidden { display: none; }
    .loading { text-align: center; padding: 20px; font-weight: bold; color: #64748b; }
    .info-badge { font-size: 0.8rem; background-color: #e0f2fe; color: #0369a1; padding: 4px 8px; border-radius: 4px; display: inline-block; margin-bottom: 10px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>システム英単語</h1>
    <button class="btn-home" onclick="backToSetup()">ホーム</button>
  </div>

  <div id="loading" class="loading">スプレッドシートからデータを通信中...</div>

  <!-- 設定・スタート画面 -->
  <div id="setup-panel" class="panel hidden">
    <!-- 単語タイプ（シート）切り替え -->
    <div class="form-group">
      <label>単語タイプ</label>
      <select id="sheet-select" onchange="fetchData()">
        <option value="通常単語">通常単語</option>
        <option value="多義語">多義語</option>
      </select>
    </div>

    <!-- 暗記モード / テストモード 切り替え -->
    <div class="form-group">
      <label>学習モード</label>
      <select id="study-mode-select">
        <option value="test">テストモード (1周判定)</option>
        <option value="memorize">暗記モード (覚えるまでループ)</option>
      </select>
    </div>

    <div class="form-group">
      <label>出題形式</label>
      <select id="mode-select">
        <option value="en2ja">英語 → 日本語</option>
        <option value="ja2en">日本語 → 英語</option>
      </select>
    </div>

    <div class="form-group">
      <label>出題範囲 (番号)</label>
      <div class="range-inputs">
        <input type="number" id="start-num" value="1" min="1">
        <span>〜</span>
        <input type="number" id="end-num" value="1" min="1">
      </div>
    </div>

    <div class="form-group">
      <label>出題問題数</label>
      <select id="question-count">
        <option value="10">10問</option>
        <option value="20">20問</option>
        <option value="40">40問</option>
        <option value="100">100問</option>
        <option value="all">選択範囲すべて</option>
      </select>
    </div>

    <button class="btn" onclick="startTest()">テスト開始</button>
  </div>

  <!-- 学習画面 -->
  <div id="test-panel" class="hidden">
    <div style="text-align: center; margin-bottom: 10px;">
      <span class="info-badge" id="study-mode-badge">テストモード</span>
      <div style="font-weight: bold;" id="progress-text">1 / 40</div>
    </div>
    
    <div class="card">
      <span class="card-num" id="card-num">No.1</span>
      <span class="card-label" id="mode-label">英 → 日</span>
      <div class="question-text" id="question-text">follow</div>
      <div class="answer-text hidden" id="answer-text">〜の後に続く、〜に従う</div>
    </div>

    <!-- ステップ1: 答えを見るボタン -->
    <button id="show-ans-btn" class="btn" onclick="showAnswer()">答えを見る</button>

    <!-- ステップ2: 自己判定ボタン -->
    <div id="eval-btns" class="answer-btns hidden">
      <button class="btn btn-ng" onclick="handleEval(false)">覚えていない (✕)</button>
      <button class="btn btn-ok" onclick="handleEval(true)">覚えている (◯)</button>
    </div>
  </div>

  <!-- 結果画面 -->
  <div id="result-panel" class="panel hidden">
    <h2>学習結果</h2>
    <div class="result-score" id="result-score">0 / 0</div>
    <p style="text-align: center; margin-bottom: 15px;" id="result-detail"></p>
    
    <!-- 苦手リスト復習ボタン（テストモードで間違えた場合のみ表示） -->
    <button id="review-btn" class="btn btn-review hidden" onclick="startReview()">間違えた問題を復習する</button>
    <button class="btn" onclick="backToSetup()">ホームに戻る</button>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzhsyshX1r3Rkx5ZYmpjfnfLsD-4XEQfEgZ4grNkkLbm8d9mGVm0Xj8Zu0di50YXj7Z2g/exec';

    let allWords = [];
    let testQueue = [];
    let wrongWords = []; // 苦手リスト（間違えた問題）
    let currentIndex = 0;
    let correctCount = 0;
    let initialTotalCount = 0;
    
    let currentMode = 'en2ja'; // 'en2ja' or 'ja2en'
    let studyMode = 'test';   // 'test' or 'memorize'

    window.onload = function() {
      fetchData();
    };

    // スプレッドシートからデータを取得
    function fetchData() {
      const sheetName = document.getElementById('sheet-select').value;
      
      document.getElementById('setup-panel').classList.add('hidden');
      document.getElementById('loading').innerText = `「${sheetName}」のデータを取得中...`;
      document.getElementById('loading').classList.remove('hidden');

      fetch(`${GAS_URL}?sheet=${encodeURIComponent(sheetName)}`)
        .then(response => {
          if (!response.ok) throw new Error('通信エラー');
          return response.json();
        })
        .then(data => {
          allWords = data;
          document.getElementById('loading').classList.add('hidden');
          document.getElementById('setup-panel').classList.remove('hidden');
          
          if (data.length > 0) {
            document.getElementById('start-num').value = 1;
            document.getElementById('end-num').value = data[data.length - 1].num;
          } else {
            document.getElementById('start-num').value = 1;
            document.getElementById('end-num').value = 1;
            alert(`「${sheetName}」シートにデータが見つかりません。`);
          }
        })
        .catch(error => {
          console.error(error);
          document.getElementById('loading').innerText = 'データの取得に失敗しました。';
        });
    }

    // 学習開始処理
    function startTest() {
      const start = parseInt(document.getElementById('start-num').value);
      const end = parseInt(document.getElementById('end-num').value);
      const countSetting = document.getElementById('question-count').value;
      
      currentMode = document.getElementById('mode-select').value;
      studyMode = document.getElementById('study-mode-select').value;

      let filtered = allWords.filter(w => w.num >= start && w.num <= end);

      if (filtered.length === 0) {
        alert('指定された範囲に単語が存在しません。');
        return;
      }

      // ランダムシャッフル
      filtered.sort(() => Math.random() - 0.5);

      // 出題数の決定
      if (countSetting !== 'all') {
        const targetCount = parseInt(countSetting);
        testQueue = filtered.slice(0, Math.min(targetCount, filtered.length));
      } else {
        testQueue = filtered;
      }

      initialTotalCount = testQueue.length;
      currentIndex = 0;
      correctCount = 0;
      wrongWords = [];

      document.getElementById('setup-panel').classList.add('hidden');
      document.getElementById('result-panel').classList.add('hidden');
      document.getElementById('test-panel').classList.remove('hidden');

      renderQuestion();
    }

    // 問題の描画
    function renderQuestion() {
      const item = testQueue[currentIndex];
      
      document.getElementById('study-mode-badge').innerText = studyMode === 'test' ? 'テストモード' : '暗記モード';
      
      if (studyMode === 'test') {
        document.getElementById('progress-text').innerText = `${currentIndex + 1} / ${testQueue.length}`;
      } else {
        document.getElementById('progress-text').innerText = `残り: ${testQueue.length} 問`;
      }

      document.getElementById('card-num').innerText = `No.${item.num}`;

      if (currentMode === 'en2ja') {
        document.getElementById('mode-label').innerText = '英 → 日';
        document.getElementById('question-text').innerText = item.word;
        document.getElementById('answer-text').innerText = item.meaning;
      } else {
        document.getElementById('mode-label').innerText = '日 → 英';
        document.getElementById('question-text').innerText = item.meaning;
        document.getElementById('answer-text').innerText = item.word;
      }

      document.getElementById('answer-text').classList.add('hidden');
      document.getElementById('show-ans-btn').classList.remove('hidden');
      document.getElementById('eval-btns').classList.add('hidden');
    }

    // 答えを見る
    function showAnswer() {
      document.getElementById('answer-text').classList.remove('hidden');
      document.getElementById('show-ans-btn').classList.add('hidden');
      document.getElementById('eval-btns').classList.remove('hidden');
    }

    // ◯ / ✕ 判定処理
    function handleEval(isCorrect) {
      const currentItem = testQueue[currentIndex];

      if (studyMode === 'test') {
        // --- テストモードのロジック ---
        if (isCorrect) {
          correctCount++;
        } else {
          wrongWords.push(currentItem);
        }
        currentIndex++;

        if (currentIndex < testQueue.length) {
          renderQuestion();
        } else {
          showResult();
        }

      } else {
        // --- 暗記モードのロジック（覚えるまでループ） ---
        if (isCorrect) {
          correctCount++;
          testQueue.splice(currentIndex, 1); // 覚えた問題はキューから削除
        } else {
          // 間違えた問題はキューの後ろ（またはランダム位置）に移動
          const removed = testQueue.splice(currentIndex, 1)[0];
          testQueue.push(removed);
        }

        if (testQueue.length > 0) {
          if (currentIndex >= testQueue.length) {
            currentIndex = 0;
          }
          renderQuestion();
        } else {
          showResult();
        }
      }
    }

    // 苦手問題（間違えた単語）の復習スタート
    function startReview() {
      testQueue = [...wrongWords];
      wrongWords = [];
      initialTotalCount = testQueue.length;
      currentIndex = 0;
      correctCount = 0;

      // 復習はテストモードで実施
      studyMode = 'test';

      testQueue.sort(() => Math.random() - 0.5);

      document.getElementById('result-panel').classList.add('hidden');
      document.getElementById('test-panel').classList.remove('hidden');

      renderQuestion();
    }

    // 結果画面表示
    function showResult() {
      document.getElementById('test-panel').classList.add('hidden');
      document.getElementById('result-panel').classList.remove('hidden');

      const reviewBtn = document.getElementById('review-btn');

      if (studyMode === 'test') {
        const total = initialTotalCount;
        const rate = Math.round((correctCount / total) * 100);

        document.getElementById('result-score').innerText = `${correctCount} / ${total} 問正解`;
        document.getElementById('result-detail').innerText = `正答率: ${rate}%`;

        // 間違えた問題があれば復習ボタンを表示
        if (wrongWords.length > 0) {
          reviewBtn.innerText = `間違えた問題 (${wrongWords.length}問) を復習する`;
          reviewBtn.classList.remove('hidden');
        } else {
          reviewBtn.classList.add('hidden');
        }

      } else {
        document.getElementById('result-score').innerText = `全問クリア！`;
        document.getElementById('result-detail').innerText = `指定した全 ${initialTotalCount} 問を暗記しました！`;
        reviewBtn.classList.add('hidden');
      }
    }

    // ホーム（設定画面）に戻る
    function backToSetup() {
      document.getElementById('test-panel').classList.add('hidden');
      document.getElementById('result-panel').classList.add('hidden');
      document.getElementById('setup-panel').classList.remove('hidden');
    }
  </script>
</body>
</html>
